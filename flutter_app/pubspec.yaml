name: offline_islamic_app
description: Offline Quran, Azkar, Prayer Times and Qibla app.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geolocator: ^14.0.3
  adhan: ^2.0.0+1
  flutter_compass: ^0.8.1
  quran: ^1.4.1
  google_mobile_ads: ^9.1.0
  flutter_local_notifications: ^22.3.0
  intl: ^0.20.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/azkar.json
