name: Flutter Safe Boot APK

on:
  push:
    branches:
      - flutter-offline-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bundle verified offline azkar
        working-directory: flutter_app
        run: |
          mkdir -p assets/data
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/rn0x/Adhkar-json/e6d973ea0db6f7b019b0ad47e3a941be09fb8f16/adhkar.json \
            -o assets/data/azkar.json
          test -s assets/data/azkar.json
      - name: Prepare Android project
        working-directory: flutter_app
        run: |
          flutter create --platforms=android --org com.noorapp .
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permissions = '''<uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'''
          text = text.replace('<application', permissions + '\n    <application', 1)
          text = text.replace('android:label="offline_islamic_app"', 'android:label="نور"')
          marker = '</application>'
          metadata = '''        <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713" />
              '''
          text = text.replace(marker, metadata + marker, 1)
          manifest.write_text(text, encoding='utf-8')

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          if 'isCoreLibraryDesugaringEnabled = true' not in g:
              g = re.sub(r'(compileOptions\s*\{)', r'\1\n        isCoreLibraryDesugaringEnabled = true', g, count=1)
          if 'multiDexEnabled = true' not in g:
              g = re.sub(r'(defaultConfig\s*\{)', r'\1\n        multiDexEnabled = true', g, count=1)
          if 'coreLibraryDesugaring(' not in g:
              g += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          gradle.write_text(g, encoding='utf-8')
          PY
      - name: Analyze Flutter code
        working-directory: flutter_app
        run: flutter analyze
      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release
      - name: Rename APK
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk Noor-SafeBoot-v1.0.2.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-SafeBoot-v1.0.2-APK
          path: Noor-SafeBoot-v1.0.2.apk
          if-no-files-found: error
          retention-days: 30
