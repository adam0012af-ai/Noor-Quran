name: Flutter Final APK

on:
  push:
    branches:
      - flutter-offline-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android project
        working-directory: flutter_app
        run: |
          flutter create --platforms=android --org com.noorapp .
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          permissions = '''<uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'''
          text = text.replace('<application', permissions + '\n    <application', 1)
          text = text.replace('android:label="offline_islamic_app"', 'android:label="نور"')
          marker = '</application>'
          metadata = '''        <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713" />
              '''
          text = text.replace(marker, metadata + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release
      - name: Rename APK
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk Noor-Final-Test-v1.0.0.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Final-Test-v1.0.0-APK
          path: Noor-Final-Test-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
