name: Build Noor Quran v2.0.0 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          rm -rf project
          mkdir -p project
          unzip -q Noor-Quran-Source-v2.0.0-Big-Update.zip -d project
          find project -maxdepth 4 -type f | sort | head -200

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find Android project
        id: project
        run: |
          SETTINGS=$(find project \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          test -n "$SETTINGS" || (echo "Android project not found" && exit 1)
          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        id: apk
        run: |
          APK=$(find project -type f -path '*/build/outputs/apk/debug/*.apk' | head -1)
          test -n "$APK" || (echo "APK not generated" && exit 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Quran-v2.0.0-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
