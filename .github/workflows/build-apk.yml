name: Build Noor Quran v1.2.0 Human Voice APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          rm -rf project
          mkdir -p project
          unzip -q Noor-Quran-Source-v1.2.0-Human-Voice-Ready.zip -d project
          echo "=== Extracted files ==="
          find project -maxdepth 4 -type f | sort | head -200

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find Android project
        id: findproject
        shell: bash
        run: |
          SETTINGS=$(find project \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android settings.gradle/settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Android project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show Android project structure
        working-directory: ${{ steps.findproject.outputs.dir }}
        run: |
          pwd
          find . -maxdepth 5 -type f | sort | head -300

      - name: Build Debug APK
        working-directory: ${{ steps.findproject.outputs.dir }}
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find project -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            find project -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Quran-v1.2.0-Human-Voice-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
