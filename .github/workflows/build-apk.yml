name: Build Noor Quran v1.1.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v1.1.0 source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q Noor-Quran-Source-v1.1.0-Spoken-Zikr.zip -d buildsrc
          test -f buildsrc/settings.gradle
          test -f buildsrc/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Quran-v1.1.0-Spoken-Zikr
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
