name: Build Noor Quran v2.1.0 With Audio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v2.1.0 source
        run: |
          rm -rf project
          mkdir -p project
          unzip -q Noor-Quran-Source-v2.1.0-UI-Audio.zip -d project
          echo "Source extracted"

      - name: Find Android project
        id: findproject
        shell: bash
        run: |
          SETTINGS=$(find project \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Add licensed human dhikr audio
        working-directory: ${{ steps.findproject.outputs.dir }}
        shell: bash
        run: |
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 --retry-delay 2 \
            "https://upload.wikimedia.org/wikipedia/commons/7/73/Ar-%D8%A7%D9%84%D8%AD%D9%85%D8%AF_%D9%84%D9%84%D9%87.ogg" \
            -o app/src/main/res/raw/zikr_alhamdulillah.ogg
          curl -fL --retry 3 --retry-delay 2 \
            "https://upload.wikimedia.org/wikipedia/commons/6/69/Ar-eg-%D8%A7%D9%84%D9%84%D9%87_%D8%A3%D9%83%D8%A8%D8%B1.oga" \
            -o app/src/main/res/raw/zikr_allahu_akbar.ogg
          curl -fL --retry 3 --retry-delay 2 \
            "https://upload.wikimedia.org/wikipedia/commons/e/e1/Ar-%D8%A3%D8%B3%D8%AA%D8%BA%D9%81%D8%B1_%D8%A7%D9%84%D9%84%D9%87.ogg" \
            -o app/src/main/res/raw/zikr_astaghfirullah.ogg
          ls -lh app/src/main/res/raw/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: ${{ steps.findproject.outputs.dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find project -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Package complete source with audio
        working-directory: ${{ steps.findproject.outputs.dir }}
        run: |
          rm -rf .gradle app/build build
          zip -qr "$GITHUB_WORKSPACE/Noor-Quran-v2.1.0-Source-With-Audio.zip" .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Quran-v2.1.0-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete source with audio
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Quran-v2.1.0-Source-With-Audio
          path: Noor-Quran-v2.1.0-Source-With-Audio.zip
          if-no-files-found: error
          retention-days: 30
