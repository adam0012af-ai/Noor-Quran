name: Build Noor Quran v2.0.1 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v2.0.1 source
        run: |
          rm -rf project
          mkdir -p project
          unzip -q Noor-Quran-Source-v2.0.1-Compile-Fix.zip -d project
          echo "=== Extracted source ==="
          find project -maxdepth 4 -type f | sort | head -200

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find Android project
        id: findproject
        shell: bash
        run: |
          SETTINGS=$(find project \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: ${{ steps.findproject.outputs.dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          APK=$(find project -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find project -type f -name "*.apk" -print
            exit 1
          fi
          echo "APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Quran-v2.0.1-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
